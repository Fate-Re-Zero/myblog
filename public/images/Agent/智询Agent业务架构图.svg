<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <defs>
    <style type="text/css"><![CDATA[
      .title { font: 700 22px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; fill: #2bbc8a; }
      .label { font: 600 13px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; fill: #e8e8e8; }
      .sub { font: 12px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; fill: #c0c0c0; }
      .box { fill: #252830; stroke: #3d4450; stroke-width: 1.5; }
      .box-accent { fill: #1e3a32; stroke: #2bbc8a; stroke-width: 2; }
      .box-soft { fill: #2a2f38; stroke: #4a5160; stroke-width: 1.2; }
      .layer { fill: #1a1d23; stroke: #3d4450; stroke-width: 1; stroke-dasharray: 4 3; }
      .arrow { stroke: #6a7380; stroke-width: 1.5; fill: none; marker-end: url(#arrowHead); }
    ]]></style>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6a7380"/>
    </marker>
  </defs>

  <rect width="960" height="720" fill="#14161a"/>
  <text x="480" y="36" text-anchor="middle" class="title">智询 Agent 业务架构</text>

  <!-- 用户层 -->
  <rect x="40" y="56" width="880" height="88" rx="12" class="layer"/>
  <text x="56" y="78" class="sub">服务对象</text>
  <rect x="70" y="90" width="100" height="36" rx="6" class="box-soft"/><text x="120" y="113" text-anchor="middle" class="label">玩家</text>
  <rect x="190" y="90" width="100" height="36" rx="6" class="box-soft"/><text x="240" y="113" text-anchor="middle" class="label">客服</text>
  <rect x="310" y="90" width="100" height="36" rx="6" class="box-soft"/><text x="360" y="113" text-anchor="middle" class="label">On-Call</text>
  <rect x="430" y="90" width="100" height="36" rx="6" class="box-soft"/><text x="480" y="113" text-anchor="middle" class="label">产品</text>
  <rect x="550" y="90" width="100" height="36" rx="6" class="box-soft"/><text x="600" y="113" text-anchor="middle" class="label">运营</text>
  <rect x="670" y="90" width="100" height="36" rx="6" class="box-soft"/><text x="720" y="113" text-anchor="middle" class="label">研发</text>

  <line x1="480" y1="144" x2="480" y2="168" class="arrow"/>

  <!-- 渠道层 -->
  <rect x="40" y="170" width="880" height="88" rx="12" class="layer"/>
  <text x="56" y="192" class="sub">接入渠道</text>
  <rect x="60" y="204" width="150" height="36" rx="6" class="box-soft"/><text x="135" y="227" text-anchor="middle" class="label">企业飞书</text>
  <rect x="230" y="204" width="150" height="36" rx="6" class="box-soft"/><text x="305" y="227" text-anchor="middle" class="label">企业内部聊天APP</text>
  <rect x="400" y="204" width="150" height="36" rx="6" class="box-soft"/><text x="475" y="227" text-anchor="middle" class="label">企业内部工单</text>
  <rect x="570" y="204" width="150" height="36" rx="6" class="box-soft"/><text x="645" y="227" text-anchor="middle" class="label">文档系统</text>
  <rect x="740" y="204" width="150" height="36" rx="6" class="box-soft"/><text x="815" y="227" text-anchor="middle" class="label">商城相关入口</text>

  <line x1="480" y1="258" x2="480" y2="282" class="arrow"/>

  <!-- Agent 核心 -->
  <rect x="40" y="284" width="880" height="120" rx="10" class="box-accent"/>
  <text x="480" y="312" text-anchor="middle" class="title" style="font-size:18px">智询业务 Agent</text>
  <rect x="100" y="330" width="200" height="48" rx="8" class="box"/><text x="200" y="350" text-anchor="middle" class="label">意图理解</text><text x="200" y="368" text-anchor="middle" class="sub">识别业务诉求</text>
  <rect x="380" y="330" width="200" height="48" rx="8" class="box"/><text x="480" y="350" text-anchor="middle" class="label">任务编排</text><text x="480" y="368" text-anchor="middle" class="sub">规划 · 调工具 · 汇总</text>
  <rect x="660" y="330" width="200" height="48" rx="8" class="box"/><text x="760" y="350" text-anchor="middle" class="label">人机协作</text><text x="760" y="368" text-anchor="middle" class="sub">确认 · 转人工 · 审计</text>

  <line x1="480" y1="404" x2="480" y2="428" class="arrow"/>

  <!-- 技能域 -->
  <rect x="40" y="430" width="880" height="130" rx="12" class="layer"/>
  <text x="56" y="452" class="sub">业务技能域</text>
  <rect x="70" y="468" width="250" height="36" rx="6" class="box-soft"/><text x="195" y="491" text-anchor="middle" class="label">登录认证</text>
  <rect x="355" y="468" width="250" height="36" rx="6" class="box-soft"/><text x="480" y="491" text-anchor="middle" class="label">支付与商城</text>
  <rect x="640" y="468" width="250" height="36" rx="6" class="box-soft"/><text x="765" y="491" text-anchor="middle" class="label">风控</text>
  <rect x="70" y="516" width="250" height="36" rx="6" class="box-soft"/><text x="195" y="539" text-anchor="middle" class="label">活动与运营</text>
  <rect x="355" y="516" width="250" height="36" rx="6" class="box-soft"/><text x="480" y="539" text-anchor="middle" class="label">知识助手</text>
  <rect x="640" y="516" width="250" height="36" rx="6" class="box-soft"/><text x="765" y="539" text-anchor="middle" class="label">接入自检</text>

  <line x1="480" y1="560" x2="480" y2="584" class="arrow"/>

  <!-- 后端系统 -->
  <rect x="40" y="586" width="880" height="100" rx="12" class="layer"/>
  <text x="56" y="608" class="sub">后端能力与系统</text>
  <rect x="60" y="622" width="160" height="40" rx="8" class="box"/><text x="140" y="647" text-anchor="middle" class="label">账号 / 认证</text>
  <rect x="240" y="622" width="160" height="40" rx="8" class="box"/><text x="320" y="647" text-anchor="middle" class="label">支付 / 商城</text>
  <rect x="420" y="622" width="160" height="40" rx="8" class="box"/><text x="500" y="647" text-anchor="middle" class="label">风控服务</text>
  <rect x="600" y="622" width="160" height="40" rx="8" class="box"/><text x="680" y="647" text-anchor="middle" class="label">知识库 / 文档</text>
  <rect x="780" y="622" width="120" height="40" rx="8" class="box"/><text x="840" y="647" text-anchor="middle" class="label">检测报告</text>
</svg>
