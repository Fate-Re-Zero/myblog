e">123</span><br><span class="line">124</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">package</span> com.lixiang;</span><br><span class="line"></span><br><span class="line"><span class="keyword">import</span> <span class="keyword">static</span> dev.langchain4j.data.document.loader.FileSystemDocumentLoader.loadDocuments;</span><br><span class="line"></span><br><span class="line"><span class="keyword">import</span> java.util.List;</span><br><span class="line"></span><br><span class="line"><span class="keyword">import</span> dev.langchain4j.community.model.dashscope.QwenChatModel;</span><br><span class="line"><span class="keyword">import</span> dev.langchain4j.community.model.dashscope.QwenEmbeddingModel;</span><br><span class="line"><span class="keyword">import</span> dev.langchain4j.data.document.Document;</span><br><span class="line"><span class="keyword">import</span> dev.langchain4j.data.document.DocumentSplitter;</span><br><span class="line"><span class="keyword">import</span> dev.langchain4j.data.document.splitter.DocumentSplitters;</span><br><span class="line"><span class="keyword">import</span> dev.langchain4j.data.embedding.Embedding;</span><br><span class="line"><span class="keyword">import</span> dev.langchain4j.data.segment.TextSegment;</span><br><span class="line"><span class="keyword">import</span> dev.langchain4j.model.chat.ChatLanguageModel;</span><br><span class="line"><span class="keyword">import</span> dev.langchain4j.rag.content.retriever.ContentRetriever;</span><br><span class="line"><span class="keyword">import</span> dev.langchain4j.rag.content.retriever.EmbeddingStoreContentRetriever;</span><br><span class="line"><span class="keyword">import</span> dev.langchain4j.service.AiServices;</span><br><span class="line"><span class="keyword">import</span> dev.langchain4j.store.embedding.EmbeddingStore;</span><br><span class="line"><span class="keyword">import</span> dev.langchain4j.store.embedding.milvus.MilvusEmbeddingStore;</span><br><span class="line"><span class="keyword">import</span> io.milvus.client.MilvusServiceClient;</span><br><span class="line"><span class="keyword">import</span> io.milvus.param.ConnectParam;</span><br><span class="line"><span class="keyword">import</span> io.milvus.param.IndexType;</span><br><span class="line"></span><br><span class="line"><span class="comment">/* 演示外部向量存储的做法 */</span></span><br><span class="line"><span class="keyword">public</span> <span class="class"><span class="keyword">class</span> <span class="title">NaiveRagDemo</span> </span>&#123;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">static</span> ChatLanguageModel chatLanguageModel = QwenChatModel.builder()</span><br><span class="line">            .apiKey(<span class="string">&quot;sk-937aee4c3e654d04b84634d363f5a770&quot;</span>)</span><br><span class="line">            .modelName(<span class="string">&quot;qwen-plus&quot;</span>)</span><br><span class="line">            .build();</span><br><span class="line"></span><br><span class="line">    <span class="keyword">static</span> QwenEmbeddingModel embeddingModel = QwenEmbeddingModel.builder()</span><br><span class="line">            .apiKey(<span class="string">&quot;sk-937aee4c3e654d04b84634d363f5a770&quot;</span>)</span><br><span class="line">            .modelName(<span class="string">&quot;text-embedding-v1&quot;</span>)</span><br><span class="line">            .build();</span><br><span class="line"></span><br><span class="line">    <span class="comment">// 创建Milvus向量数据库客户端</span></span><br><span class="line">    <span class="comment">// https://docs.langchain4j.dev/integrations/embedding-stores/</span></span><br><span class="line">    <span class="keyword">static</span> MilvusServiceClient customMilvusClient = <span class="keyword">new</span> MilvusServiceClient(</span><br><span class="line">            <span class="comment">// 配置连接参数</span></span><br><span class="line">            ConnectParam.newBuilder()</span><br><span class="line">                    <span class="comment">// 设置Milvus服务器主机地址</span></span><br><span class="line">                    .withHost(<span class="string">&quot;192.168.31.230&quot;</span>)</span><br><span class="line">                    <span class="comment">// 设置Milvus服务器端口</span></span><br><span class="line">                    .withPort(<span class="number">19530</span>)</span><br><span class="line">                    <span class="comment">// 构建连接参数</span></span><br><span class="line">                    .build());</span><br><span class="line"></span><br><span class="line">    <span class="comment">// 创建Milvus向量存储构建器</span></span><br><span class="line">    <span class="keyword">static</span> EmbeddingStore&lt;TextSegment&gt; embeddingStore = MilvusEmbeddingStore.builder()</span><br><span class="line">            <span class="comment">// 设置Milvus客户端</span></span><br><span class="line">            .milvusClient(customMilvusClient)</span><br><span class="line">            <span class="comment">// 设置数据库名称</span></span><br><span class="line">            .databaseName(<span class="string">&quot;default&quot;</span>)</span><br><span class="line">            <span class="comment">// 设置集合名称</span></span><br><span class="line">            .collectionName(<span class="string">&quot;text_collection&quot;</span>)</span><br><span class="line">            <span class="comment">// 设置索引类型为FLAT(精确搜索)</span></span><br><span class="line">            .indexType(IndexType.FLAT)</span><br><span class="line">            <span class="comment">// 设置向量字段名称</span></span><br><span class="line">            .vectorFieldName(<span class="string">&quot;embedding&quot;</span>)</span><br><span class="line">            <span class="comment">// 设置向量维度(1536维)</span></span><br><span class="line">            .dimension(<span class="number">1536</span>)</span><br><span class="line">            <span class="comment">// 构建向量存储实例</span></span><br><span class="line">            .build();</span><br><span class="line"></span><br><span class="line">    <span class="comment">// 创建内容检索器实例(基于向量存储的内容检索器)</span></span><br><span class="line">    <span class="keyword">static</span> ContentRetriever contentRetriever = EmbeddingStoreContentRetriever.builder()</span><br><span class="line">            <span class="comment">// 设置向量存储实例(Milvus向量数据库)</span></span><br><span class="line">            .embeddingStore(embeddingStore)</span><br><span class="line">            <span class="comment">// 设置嵌入模型(用于查询文本的向量化)</span></span><br><span class="line">            .embeddingModel(embeddingModel)</span><br><span class="line">            <span class="comment">// 设置最大返回结果数(最多返回100条相关结果)</span></span><br><span class="line">            .maxResults(<span class="number">100</span>)</span><br><span class="line">            <span class="comment">// 设置最小相似度阈值(只返回相似度大于0.7的结果)</span></span><br><span class="line">            .minScore(<span class="number">0.7</span>)</span><br><span class="line">            <span class="comment">// 构建内容检索器实例</span></span><br><span class="line">            .build();</span><br><span class="line"></span><br><span class="line">    <span class="function"><span class="keyword">public</span> <span class="keyword">static</span> <span class="keyword">void</span> <span class="title">main</span><span class="params">(String[] args)</span> </span>&#123;</span><br><span class="line">        Assistant assistant = createAssistant();</span><br><span class="line">        init();</span><br><span class="line"></span><br><span class="line">        String input = <span class="string">&quot;鲁智深做了什么？&quot;</span>;</span><br><span class="line">        System.out.println(<span class="string">&quot;&gt; &quot;</span> + input);</span><br><span class="line">        String chat = assistant.chat(input);</span><br><span class="line">        System.out.println(<span class="string">&quot;&lt; &quot;</span> + chat);</span><br><span class="line"></span><br><span class="line">        input = <span class="string">&quot;唐僧做了什么？&quot;</span>;</span><br><span class="line">        System.out.println(<span class="string">&quot;&gt; &quot;</span> + input);</span><br><span class="line">        chat = assistant.chat(<span class="string">&quot;唐僧做了什么？&quot;</span>);</span><br><span class="line">        System.out.println(<span class="string">&quot;&lt; &quot;</span> + chat);</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="comment">/**</span></span><br><span class="line"><span class="comment">     * 初始化向量数据库，加载并处理文档数据</span></span><br><span class="line"><span class="comment">     * 1. 创建文档分割器将大文档分割为小片段</span></span><br><span class="line"><span class="comment">     * 2. 从指定目录加载所有文档</span></span><br><span class="line"><span class="comment">     * 3. 对每个文档进行分割、向量化处理</span></span><br><span class="line"><span class="comment">     * 4. 将向量和文本片段存入Milvus向量数据库</span></span><br><span class="line"><span class="comment">     */</span></span><br><span class="line">    <span class="function"><span class="keyword">private</span> <span class="keyword">static</span> <span class="keyword">void</span> <span class="title">init</span><span class="params">()</span> </span>&#123;</span><br><span class="line">        DocumentSplitter splitter = DocumentSplitters.recursive(<span class="number">1000</span>, <span class="number">0</span>);</span><br><span class="line">        List&lt;Document&gt; documents = loadDocuments(<span class="string">&quot;D:/Temp/txt&quot;</span>);</span><br><span class="line"></span><br><span class="line">        documents.forEach(document -&gt; &#123;</span><br><span class="line">            List&lt;TextSegment&gt; segments = splitter.split(document);</span><br><span class="line">            List&lt;Embedding&gt; embeddings = embeddingModel.embedAll(segments).content();</span><br><span class="line">            System.out.println(embeddings.size());</span><br><span class="line">            embeddingStore.addAll(embeddings, segments);</span><br><span class="line">        &#125;);</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="comment">/**</span></span><br><span class="line"><span class="comment">     * 创建助手实例，用于处理用户输入并生成响应</span></span><br><span class="line"><span class="comment">     * 1. 构建助手实例</span></span><br><span class="line"><span class="comment">     * 2. 设置聊天模型(通义千问)</span></span><br><span class="line"><span class="comment">     */</span></span><br><span class="line">    <span class="function"><span class="keyword">private</span> <span class="keyword">static</span> Assistant <span class="title">createAssistant</span><span class="params">()</span> </span>&#123;</span><br><span class="line">        <span class="keyword">return</span> AiServices.builder(Assistant.class)</span><br><span class="line">                .chatLanguageModel(chatLanguageModel)</span><br><span class="line">                .contentRetriever(contentRetriever)</span><br><span class="line">                .build();</span><br><span class="line">    &#125;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>
