# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 祥祥要起飞
subtitle: Stay Hungry . Stay Foolish
## 嗨，我是Start Fly XiangXiang，我是一名Java开发工程师，喜欢接触新技术（如：Vue、React、Webpack、Gulp、Node），在新的一年里，我真诚地希望我们能够保持求知若饥，虚心若愚！欢迎观看我的博客！
description: Hi, I'm Start Fly XiangXiang. I'm a Java developer. I like to touch new technologies (such as Spring, Mybatis, Dubbo, Spring Cloud, redis, Elasticsearch, rabbitmq). In the New Year, I sincerely hope that we can keep Stay Hungry Stay Foolish! Welcome to my blog!
keywords: Spring, Mybatis, Dubbo, Spring Cloud, redis, Elasticsearch, rabbitmq
author: 祥祥要起飞
language: en
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://Fate-Re-Zero.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
# RSS订阅
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '

# 搜索
search:
  path: search.xml
  field: post
  format: html
  limit: 10000
  
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: cactus1

#scheme
scheme: Pisces

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
# deploy:
#   type: ''
deploy:
  type: git
  repository: git@gitee.com:Fate-Re-Zero/fate-re-zero.git
  branch: master
